<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background circle — cyan accent, maskable safe zone: visual inside 80% = r76 centered -->
  <circle cx="96" cy="96" r="96" fill="#0891b2"/>

  <!-- ▽ The canonical Pour glyph (U+25BD WHITE DOWN-POINTING TRIANGLE).
       Used in src/tui/summary.rs ("▽ saved") and src/tui/form.rs ("▽ pour {module_key}").
